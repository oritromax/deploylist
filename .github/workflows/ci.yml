# Publishing lives in Cloudflare Pages, which builds `npm run build` from main
# and serves dist/. This workflow is the gate, not the deploy: it decides
# whether a change is fit to reach main in the first place.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Schema, prose lint, command lint, references, structure, composition.
      # This never executes a contributed verification command.
      - name: Lint checks
        run: npm run lint

      - name: Test the gate itself
        run: npm test

      - name: Build the published surface
        run: npm run build
